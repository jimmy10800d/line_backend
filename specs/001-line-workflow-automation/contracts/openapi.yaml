openapi: 3.0.3
info:
  title: LINE 自動化流程引擎 API
  description: |
    LINE Workflow Automation Engine API
    
    此 API 提供以下功能：
    - LINE Webhook 處理
    - 工作流程管理
    - 外部服務整合
    - 排程管理
    - 執行歷史查詢
  version: 1.0.0
  contact:
    name: Jimmy
    url: https://github.com/jimmy10800d/line_backend

servers:
  - url: http://localhost:8000
    description: 開發環境
  - url: https://api.example.com
    description: 生產環境

tags:
  - name: webhook
    description: LINE Webhook 處理
  - name: workflows
    description: 工作流程管理
  - name: integrations
    description: 外部服務整合
  - name: schedules
    description: 排程管理
  - name: history
    description: 執行歷史

paths:
  # ===== Webhook =====
  /webhook:
    post:
      tags:
        - webhook
      summary: LINE Webhook 端點
      description: 接收 LINE 平台發送的訊息事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineWebhookRequest'
      responses:
        '200':
          description: 成功處理
        '400':
          description: 無效的簽名
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - lineSignature: []

  # ===== Workflows =====
  /api/workflows:
    get:
      tags:
        - workflows
      summary: 取得所有工作流程
      description: 取得用戶的所有工作流程列表
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
          description: 篩選啟用/停用的流程
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
    post:
      tags:
        - workflows
      summary: 建立工作流程
      description: 建立新的工作流程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: 無效的請求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/workflows/{workflow_id}:
    get:
      tags:
        - workflows
      summary: 取得工作流程詳情
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          description: 找不到流程
    put:
      tags:
        - workflows
      summary: 更新工作流程
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
    delete:
      tags:
        - workflows
      summary: 刪除工作流程
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 刪除成功

  /api/workflows/{workflow_id}/execute:
    post:
      tags:
        - workflows
      summary: 手動執行工作流程
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                params:
                  type: object
                  description: 執行參數
      responses:
        '202':
          description: 已接受執行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLog'

  # ===== Integrations =====
  /api/integrations:
    get:
      tags:
        - integrations
      summary: 取得所有整合服務
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Integration'

  /api/integrations/{service_type}/connect:
    get:
      tags:
        - integrations
      summary: 取得 OAuth 授權 URL
      parameters:
        - name: service_type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ServiceType'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth_url:
                    type: string
                    format: uri
                    description: OAuth 授權連結

  /api/integrations/{service_type}/callback:
    get:
      tags:
        - integrations
      summary: OAuth 回調端點
      parameters:
        - name: service_type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ServiceType'
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: 授權碼
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: 重定向到成功頁面

  /api/integrations/{service_type}:
    delete:
      tags:
        - integrations
      summary: 移除整合服務
      parameters:
        - name: service_type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ServiceType'
      responses:
        '204':
          description: 移除成功

  # ===== Schedules =====
  /api/schedules:
    get:
      tags:
        - schedules
      summary: 取得所有排程
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
    post:
      tags:
        - schedules
      summary: 建立排程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'

  /api/schedules/{schedule_id}:
    put:
      tags:
        - schedules
      summary: 更新排程
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleUpdate'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    delete:
      tags:
        - schedules
      summary: 刪除排程
      parameters:
        - name: schedule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 刪除成功

  # ===== History =====
  /api/history:
    get:
      tags:
        - history
      summary: 取得執行歷史
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
          description: 回傳數量上限
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ExecutionStatus'
          description: 篩選狀態
        - name: workflow_id
          in: query
          schema:
            type: string
            format: uuid
          description: 篩選特定工作流程
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionLog'

  /api/history/{log_id}:
    get:
      tags:
        - history
      summary: 取得執行詳情
      parameters:
        - name: log_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLog'

components:
  schemas:
    # ===== Enums =====
    ServiceType:
      type: string
      enum:
        - google_calendar
        - notion
        - github
      description: |
        外部服務類型
        - google_calendar: Google Calendar
        - notion: Notion
        - github: GitHub

    ExecutionStatus:
      type: string
      enum:
        - pending
        - running
        - success
        - failed
        - cancelled
      description: |
        執行狀態
        - pending: 等待執行
        - running: 執行中
        - success: 成功
        - failed: 失敗
        - cancelled: 已取消

    TriggerType:
      type: string
      enum:
        - command
        - schedule
        - webhook
      description: |
        觸發類型
        - command: 指令觸發
        - schedule: 排程觸發
        - webhook: Webhook 觸發

    # ===== Models =====
    Workflow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "早安提醒"
        description:
          type: string
          example: "每天早上發送今日行程"
        trigger:
          $ref: '#/components/schemas/Trigger'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        is_active:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkflowCreate:
      type: object
      required:
        - name
        - trigger
        - steps
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        trigger:
          $ref: '#/components/schemas/Trigger'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
          minItems: 1

    WorkflowUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        trigger:
          $ref: '#/components/schemas/Trigger'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        is_active:
          type: boolean

    Trigger:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/TriggerType'
        value:
          type: string
          example: "/morning"

    WorkflowStep:
      type: object
      required:
        - order
        - type
        - action
      properties:
        order:
          type: integer
          minimum: 1
        type:
          type: string
          example: "google_calendar"
        action:
          type: string
          example: "query"
        params:
          type: object
        output_var:
          type: string
          description: 輸出變數名稱（供後續步驟使用）

    Integration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_type:
          $ref: '#/components/schemas/ServiceType'
        is_connected:
          type: boolean
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        name:
          type: string
        cron_expression:
          type: string
          example: "0 9 * * *"
        next_run_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    ScheduleCreate:
      type: object
      required:
        - workflow_id
        - name
        - cron_expression
      properties:
        workflow_id:
          type: string
          format: uuid
        name:
          type: string
        cron_expression:
          type: string

    ScheduleUpdate:
      type: object
      properties:
        name:
          type: string
        cron_expression:
          type: string
        is_active:
          type: boolean

    ExecutionLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        task_type:
          type: string
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        input:
          type: object
        output:
          type: object
        error:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    LineWebhookRequest:
      type: object
      properties:
        destination:
          type: string
        events:
          type: array
          items:
            type: object

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  securitySchemes:
    lineSignature:
      type: apiKey
      in: header
      name: X-Line-Signature
      description: LINE 平台的請求簽名
